<script>(function(){try{if(!/[?&]splash=0/.test(location.search))return;var h=JSON.parse(sessionStorage.getItem('niao-back')||'null');if(!h||Date.now()-h.t>=20000)return;var d=document.documentElement;d.style.background=h.morph?'#16171c':'#f1eee6';d.className='pre';window.__niaoUnpre=function(){window.__niaoUnpre=null;d.classList.remove('pre');d.style.background=''};setTimeout(function(){window.__niaoUnpre&&window.__niaoUnpre()},5000)}catch(e){}})()</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<style>
:root{--deep:#14297c;--paper:#f1eee6;--grey:#8a98c4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);overscroll-behavior:none}

#stage{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#nav{position:absolute;inset:0;pointer-events:none;display:none}
body.home #nav{display:block}
#nav a{position:absolute;display:block;pointer-events:none;color:transparent;font-size:1px;overflow:hidden;outline:none}
#nav a:focus-visible{outline:.5px solid var(--grey)}
#go{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
body.dial #nav a{pointer-events:none}
</style>
</head>
